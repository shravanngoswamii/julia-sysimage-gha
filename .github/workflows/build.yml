name: Build Julia Sysimage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest-4-cores
    steps:
      - uses: actions/checkout@v6

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Install packages
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Build sysimage
        run: julia --project build_sysimage.jl

      - name: Test sysimage
        run: julia --sysimage=sysimage.so --project test_sysimage.jl

      - name: Upload sysimage
        uses: actions/upload-artifact@v4
        with:
          name: sysimage
          path: sysimage.so
