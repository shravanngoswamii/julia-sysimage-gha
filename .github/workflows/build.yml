name: Build Julia Sysimage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Allocates 10GB of swap space to prevent Out-Of-Memory (OOM) kills 
      # during the resource-intensive Julia sysimage compilation.
      - name: Add swap space
        run: |
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Install packages
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Build sysimage
        run: julia --project build_sysimage.jl

      - name: Test sysimage
        run: julia --sysimage=sysimage.so --project test_sysimage.jl

      - name: Upload sysimage
        uses: actions/upload-artifact@v4
        with:
          name: sysimage
          path: sysimage.so
