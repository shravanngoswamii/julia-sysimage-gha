name: Build Julia Sysimage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Allocate 10GB of additional swap space using a unique filename 
      # to prevent collisions with the runner's default OS configuration.
      - name: Add swap space
        run: |
          sudo dd if=/dev/zero of=/swapfile-extra bs=1M count=10240
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra
          sudo swapon /swapfile-extra

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Install packages
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Build sysimage
        run: julia --project build_sysimage.jl

      - name: Test sysimage
        run: julia --sysimage=sysimage.so --project test_sysimage.jl

      - name: Upload sysimage
        uses: actions/upload-artifact@v6
        with:
          name: sysimage
          path: sysimage.so
